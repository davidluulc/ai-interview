name: ai-interview

services:
  app:
    image: ai-interview-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-replace_with_dashscope_api_key}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-plus}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-2048}
      EMBEDDING_REQUIRE_MODEL_MATCH: ${EMBEDDING_REQUIRE_MODEL_MATCH:-true}
      VECTOR_SEARCH_BACKEND: ${VECTOR_SEARCH_BACKEND:-sqlite}
      DASHSCOPE_RERANK_MODEL: ${DASHSCOPE_RERANK_MODEL:-qwen3-rerank}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      SECRET_KEY: ${SECRET_KEY:-replace_with_long_random_secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_interview:replace_with_postgres_password@db:5432/ai_interview}
      AUTO_INIT_DB: ${AUTO_INIT_DB:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      # langgraph_agent_v3 检索工具经 MCP server（默认关闭；开启前需确认 mcp 服务可达）
      MCP_TOOLS_ENABLED: ${MCP_TOOLS_ENABLED:-false}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:8000/mcp}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  mcp:
    # MCP server：与 app 同镜像跑 streamable-http transport（检索/出题/复盘工具）。
    # MCP_HOST 显式覆盖为 0.0.0.0（默认回环策略是给本机进程的；容器内必须绑全网卡
    # 才能被 app 经服务名访问）。只 expose 不 ports：仅 compose 内网可达，不发布到宿主。
    image: ai-interview-app:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "mcp_server.run_http"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_interview:replace_with_postgres_password@db:5432/ai_interview}
      AUTO_INIT_DB: ${AUTO_INIT_DB:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    image: ai-interview-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-replace_with_dashscope_api_key}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-plus}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-2048}
      EMBEDDING_REQUIRE_MODEL_MATCH: ${EMBEDDING_REQUIRE_MODEL_MATCH:-true}
      VECTOR_SEARCH_BACKEND: ${VECTOR_SEARCH_BACKEND:-sqlite}
      DASHSCOPE_RERANK_MODEL: ${DASHSCOPE_RERANK_MODEL:-qwen3-rerank}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      SECRET_KEY: ${SECRET_KEY:-replace_with_long_random_secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ai_interview:replace_with_postgres_password@db:5432/ai_interview}
      AUTO_INIT_DB: ${AUTO_INIT_DB:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
    command: ["celery", "-A", "backend_python.celery_app.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    # pgvector/pgvector:pg16 = postgres:16 + 预装 vector 扩展（rag_chunks.embedding_vec 的 HNSW 检索依赖它）
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview}
      POSTGRES_USER: ${POSTGRES_USER:-ai_interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/ai-interview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html/vue:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
